[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "material-balance-studio"
version = "0.1.0"
description = "Auditable single-tank black-oil material balance engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2",
    "streamlit>=1.50,<2", "plotly>=5.20,<8", "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
